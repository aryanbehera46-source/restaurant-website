<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Admin</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }


        /* ==========================================
           LOGIN SCREEN
        ========================================== */

        .login-screen {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.75),
                    rgba(0, 0, 0, 0.85)
                );

        }


        .login-box {

            width: 90%;

            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.3);

        }


        .login-box h1 {

            text-align: center;

            margin-bottom: 8px;

        }


        .login-box p {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        .login-group {

            margin-bottom: 20px;

        }


        .login-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        .login-group input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        .login-group input:focus {

            outline: none;

            border-color: #d4af37;

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 6px;

            background: #111;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .login-button:hover {

            background: #333;

        }


        .login-error {

            margin-top: 15px;

            color: #c0392b;

            text-align: center;

            display: none;

        }


        /* ==========================================
           ADMIN DASHBOARD
        ========================================== */

        .admin-dashboard {

            display: none;

        }


        header {

            background: #111;

            color: white;

            padding: 25px 40px;

        }


        header h1 {

            margin-bottom: 5px;

        }


        header p {

            color: #bbb;

        }


        .container {

            max-width: 1200px;

            margin: 40px auto;

            padding: 0 20px;

        }


        /* ==========================================
           TOP BAR
        ========================================== */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .top-bar h2 {

            font-size: 28px;

        }


        .top-actions {

            display: flex;

            gap: 10px;

        }


        button {

            background: #111;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 6px;

            cursor: pointer;

        }


        button:hover {

            background: #333;

        }


        .logout-button {

            background: #8e2b2b;

        }


        .logout-button:hover {

            background: #6f2020;

        }


        /* ==========================================
           STATISTICS
        ========================================== */

        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .stat-card {

            background: white;

            padding: 22px;

            border-radius: 10px;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

        }


        .stat-title {

            color: #777;

            font-size: 14px;

            margin-bottom: 10px;

        }


        .stat-number {

            font-size: 32px;

            font-weight: bold;

        }


        /* ==========================================
           FILTERS
        ========================================== */

        .filters {

            display: grid;

            grid-template-columns:
                2fr 1fr 1fr auto;

            gap: 15px;

            background: white;

            padding: 18px;

            border-radius: 10px;

            margin-bottom: 25px;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

        }


        .filters input,
        .filters select {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;

        }


        .filters input:focus,
        .filters select:focus {

            outline: none;

            border-color: #d4af37;

        }


        .clear-button {

            background: #555;

            white-space: nowrap;

        }


        /* ==========================================
           TABLE
        ========================================== */

        .table-wrapper {

            background: white;

            border-radius: 10px;

            overflow-x: auto;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1100px;

        }


        th,
        td {

            padding: 15px;

            text-align: left;

            border-bottom:
                1px solid #eee;

        }


        th {

            background: #111;

            color: white;

        }


        tr:hover {

            background: #fafafa;

        }


        .status-select {

            padding: 7px 10px;

            border-radius: 5px;

            border: 1px solid #ccc;

            cursor: pointer;

        }


        .delete-button {

            margin-left: 8px;

            background: #c0392b;

            color: white;

            border: none;

            padding: 7px 10px;

            border-radius: 5px;

            cursor: pointer;

        }


        .delete-button:hover {

            background: #a93226;

        }


        /* ==========================================
           STATES
        ========================================== */

        .loading,
        .error,
        .empty {

            padding: 30px;

            text-align: center;

        }


        .error {

            color: #c00;

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 900px) {

            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .filters {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 600px) {

            header {

                padding: 20px;

            }


            .container {

                margin: 25px auto;

            }


            .top-bar {

                align-items: flex-start;

                gap: 15px;

                flex-direction: column;

            }


            .top-actions {

                width: 100%;

            }


            .top-actions button {

                flex: 1;

            }


            .stats-grid {

                grid-template-columns: 1fr;

            }


            .login-box {

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         LOGIN SCREEN
    ========================================== -->

    <div
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">

            <h1>Restaurant Admin</h1>

            <p>
                Sign in to manage reservations
            </p>


            <form id="loginForm">

                <div class="login-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="login-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


                <div
                    id="loginError"
                    class="login-error"
                ></div>

            </form>

        </div>

    </div>


    <!-- ==========================================
         ADMIN DASHBOARD
    ========================================== -->

    <div
        id="adminDashboard"
        class="admin-dashboard"
    >


        <header>

            <h1>
                Restaurant Admin
            </h1>

            <p>
                Reservation Management Dashboard
            </p>

        </header>


        <div class="container">


            <!-- TOP BAR -->

            <div class="top-bar">

                <h2>
                    Reservations
                </h2>


                <div class="top-actions">

                    <button
                        onclick="loadReservations()"
                    >
                        Refresh
                    </button>


                    <button
                        class="logout-button"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>

            </div>


            <!-- ==========================================
                 STATISTICS
            ========================================== -->

            <div class="stats-grid">


                <div class="stat-card">

                    <div class="stat-title">
                        Total
                    </div>

                    <div
                        id="totalCount"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        New
                    </div>

                    <div
                        id="newCount"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        Confirmed
                    </div>

                    <div
                        id="confirmedCount"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        Completed
                    </div>

                    <div
                        id="completedCount"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        Cancelled
                    </div>

                    <div
                        id="cancelledCount"
                        class="stat-number"
                    >
                        0
                    </div>

                </div>


            </div>


            <!-- ==========================================
                 FILTERS
            ========================================== -->

            <div class="filters">


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search name, email or phone..."
                >


                <select id="statusFilter">

                    <option value="">
                        All Statuses
                    </option>

                    <option value="New">
                        New
                    </option>

                    <option value="Confirmed">
                        Confirmed
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>


                <input
                    type="date"
                    id="dateFilter"
                >


                <button
                    class="clear-button"
                    onclick="clearFilters()"
                >
                    Clear Filters
                </button>


            </div>


            <!-- ==========================================
                 RESERVATION TABLE
            ========================================== -->

            <div class="table-wrapper">


                <div
                    id="loading"
                    class="loading"
                >
                    Loading reservations...
                </div>


                <div
                    id="error"
                    class="error"
                    style="display: none;"
                ></div>


                <table
                    id="reservationTable"
                    style="display: none;"
                >

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Date</th>

                            <th>Time</th>

                            <th>Guests</th>

                            <th>Phone</th>

                            <th>Special Request</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody
                        id="reservationBody"
                    ></tbody>


                </table>


                <div
                    id="empty"
                    class="empty"
                    style="display: none;"
                >
                    No reservations found.
                </div>


            </div>


        </div>


    </div>


    <script>


        // ==========================================
        // API SETTINGS
        // ==========================================

        const API_URL =
            "http://127.0.0.1:5001";


        // ==========================================
        // TOKEN
        // ==========================================

        let adminToken =
            localStorage.getItem(
                "restaurantAdminToken"
            );


        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const loginError =
                        document
                            .getElementById("loginError");


                    loginError.style.display =
                        "none";


                    try {


                        const response =
                            await fetch(
                                `${API_URL}/admin/login`,
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({

                                            username:
                                                username,

                                            password:
                                                password

                                        })

                                }
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            throw new Error(
                                data.message ||
                                "Login failed."
                            );

                        }


                        // Save JWT token

                        adminToken =
                            data.token;


                        localStorage.setItem(
                            "restaurantAdminToken",
                            adminToken
                        );


                        // Show dashboard

                        showDashboard();


                    } catch (error) {

                        console.error(
                            "Login error:",
                            error
                        );


                        loginError.textContent =
                            error.message ||
                            "Unable to login.";


                        loginError.style.display =
                            "block";

                    }

                }
            );


        // ==========================================
        // SHOW DASHBOARD
        // ==========================================

        function showDashboard() {

            document
                .getElementById("loginScreen")
                .style.display = "none";


            document
                .getElementById("adminDashboard")
                .style.display = "block";


            loadReservations();

        }


        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            localStorage.removeItem(
                "restaurantAdminToken"
            );


            adminToken = null;


            document
                .getElementById("adminDashboard")
                .style.display = "none";


            document
                .getElementById("loginScreen")
                .style.display = "flex";


            document
                .getElementById("username")
                .value = "";


            document
                .getElementById("password")
                .value = "";

        }


        // ==========================================
        // AUTH HEADERS
        // ==========================================

        function getAuthHeaders() {

            return {

                "Authorization":
                    `Bearer ${adminToken}`,

                "Content-Type":
                    "application/json"

            };

        }


        // ==========================================
        // LOAD RESERVATIONS
        // ==========================================

        async function loadReservations() {


            const loading =
                document.getElementById(
                    "loading"
                );


            const error =
                document.getElementById(
                    "error"
                );


            const table =
                document.getElementById(
                    "reservationTable"
                );


            const empty =
                document.getElementById(
                    "empty"
                );


            const body =
                document.getElementById(
                    "reservationBody"
                );


            loading.style.display =
                "block";


            error.style.display =
                "none";


            table.style.display =
                "none";


            empty.style.display =
                "none";


            try {


                if (!adminToken) {

                    logout();

                    return;

                }


                const response =
                    await fetch(
                        `${API_URL}/reservations`,
                        {

                            method: "GET",

                            headers:
                                getAuthHeaders()

                        }
                    );


                const data =
                    await response.json();


                // Token expired / invalid

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    logout();

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load reservations."
                    );

                }


                body.innerHTML = "";


                const reservations =
                    data.reservations || [];


                // Update statistics

                updateStatistics(
                    reservations
                );


                // Apply filters

                const filteredReservations =
                    applyFilters(
                        reservations
                    );


                if (
                    filteredReservations.length === 0
                ) {

                    loading.style.display =
                        "none";

                    empty.style.display =
                        "block";

                    return;

                }


                filteredReservations
                    .forEach(
                        reservation => {

                            const row =
                                document.createElement(
                                    "tr"
                                );


                            row.innerHTML = `

                                <td>
                                    ${escapeHtml(
                                        reservation.id
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        reservation.name
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        reservation.email
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        reservation.date
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        reservation.time
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        reservation.guests
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        reservation.phone
                                    )}
                                </td>

                                <td>
                                    ${
                                        reservation.specialRequest
                                            ? escapeHtml(
                                                reservation.specialRequest
                                              )
                                            : "-"
                                    }
                                </td>

                                <td>

                                    <select
                                        class="status-select"
                                        onchange="
                                            updateStatus(
                                                ${reservation.id},
                                                this.value
                                            )
                                        "
                                    >

                                        <option
                                            value="New"
                                            ${
                                                reservation.status ===
                                                "New"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            New
                                        </option>


                                        <option
                                            value="Confirmed"
                                            ${
                                                reservation.status ===
                                                "Confirmed"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Confirmed
                                        </option>


                                        <option
                                            value="Completed"
                                            ${
                                                reservation.status ===
                                                "Completed"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Completed
                                        </option>


                                        <option
                                            value="Cancelled"
                                            ${
                                                reservation.status ===
                                                "Cancelled"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Cancelled
                                        </option>

                                    </select>


                                    <button
                                        class="delete-button"
                                        onclick="
                                            deleteReservation(
                                                ${reservation.id}
                                            )
                                        "
                                    >
                                        Delete
                                    </button>

                                </td>

                            `;


                            body.appendChild(
                                row
                            );

                        }
                    );


                loading.style.display =
                    "none";


                table.style.display =
                    "table";


            } catch (err) {


                console.error(
                    "Load error:",
                    err
                );


                loading.style.display =
                    "none";


                error.textContent =
                    err.message ||
                    "Unable to load reservations.";


                error.style.display =
                    "block";

            }

        }


        // ==========================================
        // UPDATE STATISTICS
        // ==========================================

        function updateStatistics(
            reservations
        ) {


            let total = 0;

            let newCount = 0;

            let confirmed = 0;

            let completed = 0;

            let cancelled = 0;


            reservations.forEach(
                reservation => {

                    total++;


                    if (
                        reservation.status ===
                        "New"
                    ) {
                        newCount++;
                    }


                    if (
                        reservation.status ===
                        "Confirmed"
                    ) {
                        confirmed++;
                    }


                    if (
                        reservation.status ===
                        "Completed"
                    ) {
                        completed++;
                    }


                    if (
                        reservation.status ===
                        "Cancelled"
                    ) {
                        cancelled++;
                    }

                }
            );


            document
                .getElementById(
                    "totalCount"
                )
                .textContent = total;


            document
                .getElementById(
                    "newCount"
                )
                .textContent = newCount;


            document
                .getElementById(
                    "confirmedCount"
                )
                .textContent = confirmed;


            document
                .getElementById(
                    "completedCount"
                )
                .textContent = completed;


            document
                .getElementById(
                    "cancelledCount"
                )
                .textContent = cancelled;

        }


        // ==========================================
        // FILTERS
        // ==========================================

        function applyFilters(
            reservations
        ) {


            const search =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const status =
                document
                    .getElementById(
                        "statusFilter"
                    )
                    .value;


            const date =
                document
                    .getElementById(
                        "dateFilter"
                    )
                    .value;


            return reservations.filter(
                reservation => {


                    const matchesSearch =
                        !search ||

                        String(
                            reservation.name || ""
                        )
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(
                            reservation.email || ""
                        )
                            .toLowerCase()
                            .includes(search)

                        ||

                        String(
                            reservation.phone || ""
                        )
                            .toLowerCase()
                            .includes(search);


                    const matchesStatus =
                        !status ||
                        reservation.status ===
                            status;


                    const matchesDate =
                        !date ||
                        reservation.date ===
                            date;


                    return (
                        matchesSearch &&
                        matchesStatus &&
                        matchesDate
                    );

                }
            );

        }


        // ==========================================
        // CLEAR FILTERS
        // ==========================================

        function clearFilters() {

            document
                .getElementById(
                    "searchInput"
                )
                .value = "";


            document
                .getElementById(
                    "statusFilter"
                )
                .value = "";


            document
                .getElementById(
                    "dateFilter"
                )
                .value = "";


            loadReservations();

        }


        // ==========================================
        // FILTER EVENTS
        // ==========================================

        document
            .getElementById(
                "searchInput"
            )
            .addEventListener(
                "input",
                loadReservations
            );


        document
            .getElementById(
                "statusFilter"
            )
            .addEventListener(
                "change",
                loadReservations
            );


        document
            .getElementById(
                "dateFilter"
            )
            .addEventListener(
                "change",
                loadReservations
            );


        // ==========================================
        // UPDATE RESERVATION STATUS
        // ==========================================

        async function updateStatus(
            id,
            status
        ) {


            try {


                const response =
                    await fetch(
                        `${API_URL}/reservations/${id}/status`,
                        {

                            method: "PUT",

                            headers:
                                getAuthHeaders(),

                            body:
                                JSON.stringify({
                                    status: status
                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    logout();

                    return;

                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Failed to update status."
                    );

                }


                loadReservations();


            } catch (error) {


                console.error(
                    "Error updating status:",
                    error
                );


                alert(
                    error.message ||
                    "Failed to update reservation status."
                );

            }

        }


        // ==========================================
        // DELETE RESERVATION
        // ==========================================

        async function deleteReservation(
            id
        ) {


            const confirmed =
                confirm(
                    "Are you sure you want to delete this reservation?"
                );


            if (!confirmed) {

                return;

            }


            try {


                const response =
                    await fetch(
                        `${API_URL}/reservations/${id}`,
                        {

                            method: "DELETE",

                            headers:
                                getAuthHeaders()

                        }
                    );


                const data =
                    await response.json();


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    logout();

                    return;

                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Failed to delete reservation."
                    );

                }


                loadReservations();


            } catch (error) {


                console.error(
                    "Error deleting reservation:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to delete reservation."
                );

            }

        }


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ==========================================
        // CHECK EXISTING LOGIN
        // ==========================================

        if (adminToken) {

            showDashboard();

        }

    </script>

</body>

</html>
