<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Table | Staff Management</title><style>
body{margin:0;background:#14110e;color:#f7efe3;font:16px system-ui,sans-serif}main{max-width:950px;margin:auto;padding:28px}.card{background:#211b16;border:1px solid #3a3028;border-radius:12px;padding:18px;margin:14px 0}input,select,button{padding:10px;border:1px solid #665442;border-radius:7px;font:inherit}input,select{background:#120f0c;color:#f7efe3}button{background:#d7a64a;color:#20170b;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #40352c}.muted{color:#c9b9a5}.error{color:#e67b70}.hidden{display:none}
</style></head><body><main>
<section id="login" class="card" style="max-width:420px;margin:8vh auto"><h1>Staff Management</h1><p class="muted">Administrator access only</p><form id="loginForm" class="grid"><input id="username" required autocomplete="username" placeholder="Admin username"><input id="password" required type="password" autocomplete="current-password" placeholder="Admin password"><button>Sign in</button></form><p id="message" class="error"></p></section>
<section id="workspace" class="hidden"><h1>Restaurant Team</h1><p class="muted">Create, update, deactivate, or reset staff access.</p><section class="card"><h2>Add staff member</h2><form id="createForm" class="grid"><input id="name" required maxlength="100" placeholder="Full name"><input id="newUsername" required maxlength="100" placeholder="Username"><input id="newPassword" required minlength="8" type="password" placeholder="Initial password (8+ characters)"><select id="role"><option value="chef">Chef</option><option value="admin">Administrator</option></select><button>Add staff member</button></form></section><section class="card"><h2>Current staff</h2><div id="staffList"></div></section></section>
</main><script>
const API_URL="https://royal-table-api.onrender.com";let token=localStorage.getItem("restaurantAdminToken");const $=id=>document.getElementById(id);function esc(v){const e=document.createElement("div");e.textContent=v??"";return e.innerHTML}async function api(path,options={}){const r=await fetch(API_URL+path,{...options,headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)throw new Error(d.message||"Request failed.");return d}async function load(){const d=await api("/staff");$("staffList").innerHTML=d.staff.length?`<table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Last login</th><th>Action</th></tr></thead><tbody>${d.staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.username)}</td><td>${esc(s.role)}</td><td>${s.active?"Active":"Inactive"}</td><td>${esc(s.lastLoginAt||"Never")}</td><td><button onclick="toggle(${s.id},${s.active?"false":"true"})">${s.active?"Deactivate":"Activate"}</button></td></tr>`).join("")}</tbody></table>`:"<p class=muted>No staff accounts created yet.</p>"}async function toggle(id,active){try{await api(`/staff/${id}`,{method:"PUT",body:JSON.stringify({active})});load()}catch(e){alert(e.message)}}$("loginForm").onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API_URL+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.message);token=d.token;localStorage.setItem("restaurantAdminToken",token);$("login").classList.add("hidden");$("workspace").classList.remove("hidden");load()}catch(err){$("message").textContent=err.message}};$("createForm").onsubmit=async e=>{e.preventDefault();try{await api("/staff",{method:"POST",body:JSON.stringify({name:$("name").value,username:$("newUsername").value,password:$("newPassword").value,role:$("role").value})});e.target.reset();load()}catch(err){alert(err.message)}};if(token){$("login").classList.add("hidden");$("workspace").classList.remove("hidden");load().catch(()=>localStorage.removeItem("restaurantAdminToken"))}
</script></body></html>
